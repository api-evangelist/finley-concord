name: Finley (Concord)
description: 'Finley (Concord) is Finley Technologies, a cloud-based loan administration
  and debt-capital-management platform for credit funds, banks, and private credit
  operators. The software digitizes 200+ credit-agreement fields and covers loan servicing
  (KYC, money movement, notice delivery), portfolio and borrowing-base monitoring,
  syndicated-loan management, and backup / credit administration, plus Finley AI for
  automating calculations, compliance checks, and notices. Finley is backed by Bain
  Capital Ventures and is delivered as a hosted web application at app.finleycms.com
  with product documentation at docs.finleycms.com. No public developer API, OpenAPI
  specification, or SDK is published at this time.'
